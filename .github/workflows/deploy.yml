name: Deploy naar Azure Function App

# GEPARKEERD: automatische trigger op push staat uit tot de Entra ID/OIDC-setup
# met de IT-partner rond is (zie README.md, sectie "Deployen"). Tot die tijd
# handmatig deployen vanuit VS Code, zoals voorheen. Handmatig testen van deze
# workflow kan wel via "Run workflow" in de Actions-tab (workflow_dispatch).
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: wbso-conversie-portal-rvo-g7hjamfvc7g8aeet

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure-login (OIDC, service principal)
        uses: Azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy naar Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true
          remote-build: true
